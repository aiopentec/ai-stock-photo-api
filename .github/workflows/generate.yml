name: AI Stock Photo Generator

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Filenames to regenerate (space-separated)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests Pillow
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then pip install openai; fi

      - name: Regenerate specific images (if requested)
        if: ${{ github.event.inputs.regenerate != '' }}
        run: |
          mkdir -p images/thumbs api
          python scripts/regenerate.py ${{ github.event.inputs.regenerate }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_API_TOKEN:   ${{ secrets.HF_API_TOKEN }}

      - name: Optimise existing images (PNG->WebP + thumbnails)
        run: python scripts/optimize_images.py

      - name: Generate new images
        run: |
          mkdir -p images/thumbs api
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "Provider: gpt-image-1"
            python scripts/generate_dalle.py
          elif [ -n "$HF_API_TOKEN" ]; then
            echo "Provider: HuggingFace SD 3.5"
            python scripts/generate_huggingface.py
          else
            echo "Provider: Pollinations FLUX"
            python scripts/generate_pollinations.py
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_API_TOKEN:   ${{ secrets.HF_API_TOKEN }}

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit changes
        run: |
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          git add images/ api/images.json sitemap.xml
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M')
          git commit -m "Generated stock photos - $TIMESTAMP" || exit 0
          git push

  deploy-pages:
    needs: generate-images
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
